[project]
name = "bayora-api"
version = "1.0.0"
description = "BAYORA Control Plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "psycopg2-binary>=2.9.10",
]

[tool.vercel]
entrypoint = "apps.api.main:app"
