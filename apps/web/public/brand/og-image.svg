<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Deep neutral background with technical grid -->
  <rect width="1200" height="630" fill="#090d16" />
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Technical border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Corner registration marks -->
  <path d="M50 70 V50 H70" stroke="#6366f1" stroke-width="2" />
  <path d="M1150 70 V50 H1130" stroke="#6366f1" stroke-width="2" />
  <path d="M50 560 V580 H70" stroke="#6366f1" stroke-width="2" />
  <path d="M1150 560 V580 H1130" stroke="#6366f1" stroke-width="2" />

  <!-- Brand logo mark -->
  <g transform="translate(100, 100) scale(1.6)">
    <path d="M24 4L38 9.5V21C38 30.5 32 39 24 44C16 39 10 30.5 10 21V9.5L24 4Z" 
          stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" fill="#1e1b4b" />
    <rect x="20" y="20" width="8" height="8" rx="2" fill="#818cf8" />
    <circle cx="17" cy="16" r="3" fill="#f43f5e" />
    <circle cx="17" cy="30" r="3" fill="#3b82f6" />
    <circle cx="31" cy="23" r="3" fill="#10b981" />
  </g>

  <!-- Typography -->
  <text x="200" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#f8fafc">BAYORA</text>
  <text x="200" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#818cf8">AI SAFETY ISOLATION INFRASTRUCTURE</text>

  <text x="100" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Test the model.
  </text>
  <text x="100" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#818cf8" letter-spacing="-0.5">
    Trust the environment.
  </text>

  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" width="600">
    Verifiable network isolation and cryptographic audit chains for adversarial AI evaluation.
  </text>

  <!-- Spec Pills -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="90" y="25" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8">OWASP LLM Top 10</text>
  </g>

  <g transform="translate(295, 470)">
    <rect x="0" y="0" width="200" height="40" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="100" y="25" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#34d399">SHA-256 Hash Chain</text>
  </g>

  <g transform="translate(510, 470)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="90" y="25" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#a78bfa">4-Zone Network Iso</text>
  </g>

  <!-- Right side technical blueprint diagram -->
  <g transform="translate(740, 160)">
    <!-- Boundary border -->
    <rect x="0" y="0" width="370" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="30" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">ISOLATION TOPOLOGY</text>

    <!-- Red Zone -->
    <rect x="25" y="55" width="135" height="75" rx="8" fill="#1e1b2e" stroke="#e11d48" stroke-width="1.5" />
    <circle cx="45" cy="80" r="5" fill="#f43f5e" />
    <text x="58" y="84" font-family="monospace" font-size="11" font-weight="600" fill="#fecdd3">red-net</text>
    <text x="35" y="112" font-family="system-ui" font-size="10" fill="#f43f5e">Untrusted Runner</text>

    <!-- Blue Zone -->
    <rect x="25" y="155" width="135" height="75" rx="8" fill="#172033" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="45" cy="180" r="5" fill="#3b82f6" />
    <text x="58" y="184" font-family="monospace" font-size="11" font-weight="600" fill="#bfdbfe">blue-net</text>
    <text x="35" y="212" font-family="system-ui" font-size="10" fill="#60a5fa">Defensive Policy</text>

    <!-- Gateway -->
    <rect x="205" y="80" width="140" height="95" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <rect x="220" y="95" width="16" height="16" rx="3" fill="#6366f1" />
    <text x="245" y="108" font-family="monospace" font-size="12" font-weight="700" fill="#e0e7ff">GATEWAY</text>
    <text x="220" y="135" font-family="system-ui" font-size="10" fill="#a5b4fc">Mediation &amp; Auth</text>
    <text x="220" y="152" font-family="monospace" font-size="9" fill="#818cf8">:8002 INSPECTION</text>

    <!-- Model Zone -->
    <rect x="205" y="210" width="140" height="70" rx="8" fill="#062e24" stroke="#059669" stroke-width="1.5" />
    <circle cx="225" cy="235" r="5" fill="#10b981" />
    <text x="238" y="239" font-family="monospace" font-size="11" font-weight="600" fill="#a7f3d0">model-net</text>
    <text x="220" y="262" font-family="system-ui" font-size="10" fill="#34d399">Target Model</text>

    <!-- Vectors -->
    <path d="M160 92 H205" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M160 192 L205 155" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M275 175 V210" stroke="#10b981" stroke-width="2" />
    <!-- Blocked Cross route -->
    <path d="M92 130 V155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="96" y="146" font-family="monospace" font-size="10" font-weight="700" fill="#ef4444">✕ BLOCKED</text>
  </g>
</svg>
